# GPU profile: the two-model split co-resident on one 32 GB GPU, served by vLLM, reachable only on
# the internal compose network. The orchestrator talks to it on loopback-equivalent service DNS.
# Pull the cable: model traffic is on an internal network with no gateway, the console is published
# on the host's loopback only, and target code runs in --network=none sandbox containers.
services:
  vllm:
    image: vllm/vllm-openai:v0.8.5          # pin to the exact image carried in the bundle; never pulled
    command: ["--model", "/models/qwen3-coder-next-32b", "--served-model-name", "qwen3-coder-next-32b"]
    volumes: ["./models:/models:ro"]
    networks: ["sealed"]
    deploy:
      resources:
        reservations:
          devices: [{capabilities: ["gpu"]}]

  raksha:
    image: raksha-ai:latest
    environment:
      RAKSHA_INFERENCE_BASE_URL: "http://vllm:8000/v1"
      RAKSHA_SEALED: "1"
      RAKSHA_SANDBOX_IMAGE: "raksha-sandbox:latest"   # carried in the bundle; target code runs here
      RAKSHA_REQUIRE_SANDBOX: "1"                     # never run target code unsandboxed
      RAKSHA_BUNDLE_KEY_FILE: "/keys/bundle.key"      # generated by install.sh on this node
      # Scratch builds live on a path that is identical on the host and in this container: the
      # sandbox containers are started by the HOST's docker daemon, which mounts host paths.
      TMPDIR: "/var/lib/raksha-scratch"
    volumes:
      - "./targets:/targets:ro"
      - "./out:/out:rw"
      - "/var/lib/raksha-keys:/keys:ro"
      - "/var/lib/raksha-scratch:/var/lib/raksha-scratch:rw"
      # the orchestrator (RAKSHA's own code, air-gap-guarded) starts the sandbox containers; target
      # code itself never sees this socket — it runs inside those containers with --network=none
      - "/var/run/docker.sock:/var/run/docker.sock"
    # "sealed" is internal (no route out) and carries the model traffic. An internal network cannot
    # publish a port, so the console gets its own network, published on the HOST's loopback only.
    # Untrusted target code never runs in this container's namespace: it runs in the network-less
    # sandbox (RAKSHA_SANDBOX_IMAGE, --network=none).
    networks: ["sealed", "console"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: ["vllm"]

networks:
  console: {}
  sealed:
    internal: true                           # no gateway to the host network — egress is impossible
